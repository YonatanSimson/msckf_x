[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "msckf-tools"
version = "0.1.0"
description = "Analysis and display scripts for msckf_x"
requires-python = ">=3.10"
license = {text = "GPL-3.0-only"}
dependencies = [
  "numpy>=1.24",
  "opencv-python>=4.7",  # GUI build (Qt) so viz.py can open windows; needs cv2.aruco.ArucoDetector
  "matplotlib>=3.7",
  "pyyaml>=6",
  "rerun-sdk==0.33.0",  # play_sim.py; the version projectaria-tools pins
  "projectaria-tools==2.3.0",  # LaMAria VRS recordings (fisheye export, Fisheye624 fixture)
  "rosbags>=0.10",  # euroc_to_rosbag.py: bags for the baseline binaries, no ROS needed
]

[project.optional-dependencies]
dev = ["mypy", "black", "isort", "flake8", "types-PyYAML"]

[project.scripts]
play-euroc = "play_euroc:main"
gate-stage0-reprojection = "msckf_gates.stage0_reprojection:main"
gate-stage1a-static-init = "msckf_gates.stage1a_static_init:main"
gate-stage1-tracker = "msckf_gates.stage1_tracker:main"
gate-stage1b-dynamic-init = "msckf_gates.stage1b_dynamic_init:main"
gate-stage3-sim = "msckf_gates.stage3_sim:main"
gate-stage3-observability = "msckf_gates.stage3_observability:main"
gate-stage3-real = "msckf_gates.stage3_real:main"
gate-stage3-baselines = "msckf_gates.stage3_baselines:main"
tracker-sweep = "tracker_sweep:main"
tracker-compare = "tracker_compare:main"
benchmark-compare = "benchmark_compare:main"
play-tracks = "play_tracks:main"
play-sim = "play_sim:main"
tune-init-noise = "tune_init_noise:main"
kitti-raw-to-euroc = "kitti_raw_to_euroc:main"
lamaria-to-euroc = "lamaria_to_euroc:main"
lamaria-fisheye-to-euroc = "lamaria_fisheye_to_euroc:main"
uzh-fpv-to-euroc = "uzh_fpv_to_euroc:main"
aria-fisheye-fixture = "aria_fisheye_fixture:main"
euroc-to-rosbag = "euroc_to_rosbag:main"

[tool.setuptools]
py-modules = ["viz", "play_euroc", "tracker_sweep", "tracker_compare", "benchmark_compare", "play_tracks", "play_sim", "basalt_flow_check", "tune_init_noise", "kitti_raw_to_euroc", "euroc_layout", "lamaria_to_euroc", "lamaria_fisheye_to_euroc", "uzh_fpv_to_euroc", "aria_fisheye_fixture", "euroc_to_rosbag"]
packages = ["msckf_gates"]

[tool.black]
line-length = 120

[tool.isort]
profile = "black"
line_length = 120

[tool.mypy]
ignore_missing_imports = true
